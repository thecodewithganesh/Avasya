<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AVASYA badge — hexagon shelter over the flood -->
  <defs>
    <linearGradient id="avTeal" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FA98C"/>
      <stop offset="1" stop-color="#3BBFA0"/>
    </linearGradient>
    <linearGradient id="avGreen" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FBF3F"/>
      <stop offset="1" stop-color="#9ACD50"/>
    </linearGradient>
    <linearGradient id="avBlue" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E7BF6"/>
      <stop offset="1" stop-color="#4A9BF8"/>
    </linearGradient>
    <clipPath id="avHex">
      <path d="M32 2.5 58 17.25 V46.75 L32 61.5 6 46.75 V17.25 Z"/>
    </clipPath>
  </defs>

  <!-- Navy hexagon badge (rounded joins) -->
  <path d="M32 2.5 58 17.25 V46.75 L32 61.5 6 46.75 V17.25 Z"
        fill="#16355E" stroke="#16355E" stroke-width="3" stroke-linejoin="round"/>

  <g clip-path="url(#avHex)">
    <!-- Waves (banded: teal lines, green band, blue flood) -->
    <path d="M2 46 Q10 42.4 18 46 T34 46 T50 46 T66 46" fill="none" stroke="url(#avTeal)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M2 50.5 Q10 46.9 18 50.5 T34 50.5 T50 50.5 T66 50.5" fill="none" stroke="url(#avTeal)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M2 55.5 Q10 51.5 18 55.5 T34 55.5 T50 55.5 T66 55.5 V64 H2 Z" fill="url(#avGreen)"/>
    <path d="M2 59.5 Q10 55.5 18 59.5 T34 59.5 T50 59.5 T66 59.5 V64 H2 Z" fill="url(#avBlue)"/>

    <!-- Houses + tree on the safe horizon -->
    <g fill="#FFFFFF">
      <!-- left house -->
      <path d="M16.5 32.5 23.25 26.5 30 32.5 H28.5 V42 H18 V32.5 Z"/>
      <rect x="22" y="36.8" width="2.5" height="5.2" fill="#16355E"/>
      <!-- right house -->
      <path d="M34 32.5 40.75 26.5 47.5 32.5 H46 V42 H35.5 V32.5 Z"/>
      <rect x="39.5" y="36.8" width="2.5" height="5.2" fill="#16355E"/>
      <!-- tree between the houses -->
      <circle cx="32" cy="33.6" r="2.7"/>
      <rect x="31.2" y="35.8" width="1.6" height="5" rx="0.8"/>
    </g>

    <!-- Mountains with summit diamond -->
    <g fill="#FFFFFF">
      <path d="M8 29 21.5 11.5 35 29 Z"/>
      <path d="M27 29 38.5 14 50 29 Z"/>
      <path d="M21.5 7.6 24.6 10.7 21.5 13.8 18.4 10.7 Z"/>
    </g>
  </g>
</svg>
