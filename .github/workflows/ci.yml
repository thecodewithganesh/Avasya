name: AVASYA CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -r backend/requirements.txt
          pip install -q pytest pytest-env httpx

      - name: Run backend test suite
        # SQLite-mirrored stack via conftest; no Postgres service needed.
        env:
          DATABASE_URL: postgresql+psycopg://avasya:avasya@localhost:5432/avasya
        run: python -m pytest tests/ ai/ backend/ -q

      - name: Verify all modules compile
        run: python -m compileall -q backend ai gis

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
